name: Scheduled Upstream Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab.

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v4
    
    - name: Sync upstream changes
      uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
      with:
        target_sync_branch: main     
        target_repo_token: ${{ secrets.GITHUB_TOKEN }} # Automatically generated token
        upstream_sync_repo: ortelius/helmcharts
        upstream_sync_branch: main  
