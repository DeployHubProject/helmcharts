name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - generate-main-chart

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  setenv:
    runs-on: ubuntu-latest

    outputs:
      short_sha: ${{ steps.env.outputs.short_sha }}
      image_version: ${{ steps.env.outputs.image_version }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      image_repo_tag: ${{ steps.env.outputs.image_repo_tag }}
      image_repository: ${{ steps.env.outputs.image_repository }}
      registry: ${{ steps.env.outputs.registry }}
      branch: ${{ steps.env.outputs.branch }}
      compname: ${{ steps.env.outputs.compname }}
      dhurl: ${{ steps.env.outputs.dhurl }}
      gh_handle: ${{ steps.env.outputs.gh_handle }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout
        id: checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 1

      - name: Export env
        id: env
        env:
          DHURL: https://console.deployhub.com
          REGISTRY: quay.io
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH=$(echo "${{ env.BRANCH }}" | cut -d'/' -f1)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-6)

          {
            echo "dhurl=${{ env.DHURL }}"
            echo "branch=${BRANCH}"
            echo "compname=ortelius"
            echo "image_repo_tag=${{ env.REGISTRY }}/${{ github.repository }}:${BRANCH}-g${SHORT_SHA}"
            echo "image_repository=${{ env.REGISTRY }}/${{ github.repository }}"
            echo "image_tag=${BRANCH}-g${SHORT_SHA}"
            echo "image_version=g${SHORT_SHA}"
            echo "registry=${{ env.REGISTRY }}"
            echo "short_sha=${SHORT_SHA}"
            echo "gh_handle=$GITHUB_ACTOR"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: setenv
    uses: DeployHubProject/workflow-toolkit/.github/workflows/helm-release-workflow.yml@f4062b84b3bc7105a902b9bb440e1b1bf3b3743a
    with:
      gh_repository_owner: ${{ github.repository_owner }}
      gh_event_name: ${{ github.event_name }}
      gh_ref: ${{ github.ref }}
      gh_handle: ${{ needs.setenv.outputs.gh_handle }}
      chart: charts/${{ needs.setenv.outputs.compname }}
      chart_version: ''
      image_repository: ${{ needs.needs.setenv.outputs.image_repository }}
      image_tag: ${{ needs.setenv.outputs.image_tag }}
      run_number: ${{ github.run_number }}
    secrets:
      GPG_KEYRING_BASE64: ${{ secrets.GPG_KEYRING_BASE64 }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY: ${{ secrets.GPG_KEY }}
      gh_token: ${{ secrets.DH_HELM_INDEXER_TOKEN }}
