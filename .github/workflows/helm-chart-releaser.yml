name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # poll upstream hourly
  repository_dispatch:
    types:
      - generate-main-chart

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  setenv:
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.env.outputs.skip }}
      short_sha: ${{ steps.env.outputs.short_sha }}
      chart_version: ${{ steps.env.outputs.chart_version }}
      image_version: ${{ steps.env.outputs.image_version }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      image_repo_tag: ${{ steps.env.outputs.image_repo_tag }}
      image_repository: ${{ steps.env.outputs.image_repository }}
      registry: ${{ steps.env.outputs.registry }}
      branch: ${{ steps.env.outputs.branch }}
      compname: ${{ steps.env.outputs.compname }}
      dhurl: ${{ steps.env.outputs.dhurl }}
      gh_handle: ${{ steps.env.outputs.gh_handle }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout
        id: checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 1

      - name: Export env
        id: env
        env:
          DHURL: https://console.deployhub.com
          REGISTRY: quay.io
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH=$(echo "${{ env.BRANCH }}" | cut -d'/' -f1)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-6)

          # Latest upstream release, e.g. 12.0.230
          VERSION=$(git ls-remote --tags --refs https://github.com/ortelius/helmcharts.git 'v*' \
            | awk '{print $2}' | sed 's#refs/tags/v##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "${VERSION}" ]; then
            echo "Could not determine upstream version" >&2
            exit 1
          fi

          # On scheduled polls, skip if this repo already released that version
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            SKIP=true
          fi

          {
            echo "skip=${SKIP}"
            echo "dhurl=${{ env.DHURL }}"
            echo "branch=${BRANCH}"
            echo "chart_version=${VERSION}"
            echo "compname=ortelius"
            echo "image_repo_tag=${{ env.REGISTRY }}/${{ github.repository }}:${BRANCH}-v${VERSION}-g${SHORT_SHA}"
            echo "image_repository=${{ env.REGISTRY }}/${{ github.repository }}"
            echo "image_tag=${BRANCH}-v${VERSION}-g${SHORT_SHA}"
            echo "image_version=${VERSION}-g${SHORT_SHA}"
            echo "registry=${{ env.REGISTRY }}"
            echo "short_sha=${SHORT_SHA}"
            echo "gh_handle=$GITHUB_ACTOR"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: setenv
    if: ${{ needs.setenv.outputs.skip != 'true' }}
    uses: DeployHubProject/workflow-toolkit/.github/workflows/helm-release-workflow.yml@<NEW_TOOLKIT_SHA>
    with:
      gh_repository_owner: ${{ github.repository_owner }}
      gh_event_name: ${{ github.event_name }}
      gh_ref: ${{ github.ref }}
      gh_handle: ${{ needs.setenv.outputs.gh_handle }}
      chart: charts/${{ needs.setenv.outputs.compname }}
      chart_version: ${{ github.event_name != 'repository_dispatch' && needs.setenv.outputs.chart_version || '' }}
      image_repository: ${{ needs.setenv.outputs.image_repository }}
      image_tag: ${{ needs.setenv.outputs.image_tag }}
      run_number: ${{ github.run_number }}
    secrets:
      GPG_KEYRING_BASE64: ${{ secrets.GPG_KEYRING_BASE64 }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY: ${{ secrets.GPG_KEY }}
      gh_token: ${{ secrets.DH_HELM_INDEXER_TOKEN }}
